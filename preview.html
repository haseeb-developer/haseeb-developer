<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Haseeb Developer — README Preview</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0d1117;
        --line: #30363d;
        --text: #e6edf3;
        --muted: #8b949e;
        --link: #58a6ff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          16px/1.6 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      main {
        max-width: 1000px;
        margin: 0 auto;
        padding: 20px 24px 48px;
      }
      img {
        max-width: 100%;
        height: auto;
      }
      a {
        color: var(--link);
      }
      .hero {
        display: block;
        width: 100%;
        margin: 0 auto 12px;
      }
      .nav {
        text-align: center;
        margin: 8px auto 18px;
      }
      .nav-row {
        display: flex;
        flex-wrap: wrap;
        justify-content: stretch;
        align-items: center;
        gap: 10px;
      }
      .nav-row img {
        display: block;
        height: 40px;
        width: 100%;
        object-fit: fill;
      }
      .nav-row a {
        flex: 1 1 0;
        line-height: 0;
      }
      .divider {
        display: block;
        width: 100%;
        height: auto;
        margin: 0;
      }
      .panel {
        display: block;
        margin: 18px 0;
      }
      .center {
        text-align: center;
      }
      .profile {
        width: 100%;
        border-collapse: collapse;
        margin: 20px 0;
      }
      .profile td {
        vertical-align: top;
      }
      pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        background: #161b22;
        border-radius: 6px;
        padding: 16px;
        color: var(--text);
      }
      summary {
        cursor: pointer;
      }
      summary code {
        color: #7ee787;
      }
      details img {
        display: block;
        width: 100%;
        margin: 12px 0;
      }
      .note {
        color: var(--muted);
      }
      .project-links {
        line-height: 2.1;
      }
    </style>
  </head>
  <body>
    <main>
      <img
        class="hero"
        src="assets/hero.svg"
        alt="Haseeb — Frontend and Shopify Developer, animated boot sequence"
      />
      <nav class="nav nav-row" aria-label="Portfolio and hiring links">
        <a href="https://haseebkn.vercel.app/"
          ><img src="assets/btn-open-portfolio.svg" alt="open portfolio"
        /></a>
        <a href="https://www.upwork.com/freelancers/haseebkn"
          ><img src="assets/btn-hire-me.svg" alt="hire me"
        /></a>
      </nav>
      <img class="divider" src="assets/divider.svg" alt="" />
      <br />
      <section id="sysinfo">
        <img
          class="panel"
          src="assets/sysinfo.svg"
          alt="Animated system information and visual map"
        />
        <br />
        <img class="divider" src="assets/divider.svg" alt="" />
        <br />
        <img
          class="panel"
          src="assets/stack.svg"
          alt="Animated stack matrix: 33 tools across 6 domains, with exploration and daily-tooling details"
        />
        <br />
        <img class="divider" src="assets/divider.svg" alt="" />
        <br />
        <section id="work" style="margin: 0; display: block">
          <img
            src="assets/work.svg"
            alt="Animated work matrix"
            style="display: block; width: 100%"
          />
        </section>
        <br />
        <img class="divider" src="assets/divider.svg" alt="" />
        <br />
      </section>
      <section id="stack">
        <img src="assets/skills.svg" alt="Animated skill dependency graph" />
      </section>
      <br />
      <img class="divider" src="assets/divider.svg" alt="" />
      <br />
      <section id="radar">
        <img
          src="assets/radar.svg"
          alt="Animated production experience radar"
        />
      </section>
      <br />
      <img class="divider" src="assets/divider.svg" alt="" />
      <br />
      <section id="architecture">
        <img
          src="assets/pipeline.svg"
          alt="Animated design-to-production pipeline"
        />
      </section>
      <br />
      <img class="divider" src="assets/divider.svg" alt="" />
      <p class="center note">END OF TRANSMISSION</p>
    </main>
  </body>
</html>
